[project]
name = "tt"
version = "0.1.0"
description = "Bulls and Bears research: data, statistics, backtests and the specs and goldens they emit. Never talks to a broker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "yfinance==1.7.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pyarrow-stubs>=17",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D", "ANN", "RUF"]
ignore = ["D203", "D213", "D401", "ANN401", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
